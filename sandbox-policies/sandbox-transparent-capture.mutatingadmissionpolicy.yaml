apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: sandbox-transparent-capture.pratiks.io
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: >-
        [JSONPatch{op:"add",path:"/spec/initContainers",value:[Object.spec.initContainers{name:"sandbox-iptables",image:"localhost:5000/sandbox/transparent-iptables-init:0.1.0",securityContext:Object.spec.initContainers.securityContext{runAsUser:0,capabilities:Object.spec.initContainers.securityContext.capabilities{add:["NET_ADMIN"]}}},Object.spec.initContainers{name:"sandbox-install-ca",image:"localhost:5000/sandbox/transparent-mitmproxy:0.1.0"}]},JSONPatch{op:"add",path:"/spec/containers/-",value:Object.spec.containers{name:"sandbox-mitmproxy",image:"localhost:5000/sandbox/transparent-mitmproxy:0.1.0"}}]