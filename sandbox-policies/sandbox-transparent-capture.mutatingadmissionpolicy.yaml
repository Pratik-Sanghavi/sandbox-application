apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: sandbox-transparent-capture.pratiks.io
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: does-not-already-have-sandbox-mitmproxy
      expression: '!object.spec.containers.exists(container, container.name == "sandbox-mitmproxy")'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.spec.volumes)
            ? [
                JSONPatch{op: "add", path: "/spec/volumes/-", value: Object.spec.volumes{name: "sandbox-mitmproxy-runtime", emptyDir: Object.spec.volumes.emptyDir{}}},
                JSONPatch{op: "add", path: "/spec/volumes/-", value: Object.spec.volumes{name: "sandbox-mitmproxy-ca", secret: Object.spec.volumes.secret{secretName: "sandbox-mitmproxy-ca"}}}
              ]
            : [
                JSONPatch{op: "add", path: "/spec/volumes", value: [Object.spec.volumes{name: "sandbox-mitmproxy-runtime", emptyDir: Object.spec.volumes.emptyDir{}}, Object.spec.volumes{name: "sandbox-mitmproxy-ca", secret: Object.spec.volumes.secret{secretName: "sandbox-mitmproxy-ca"}}]}
              ])
          +
          (has(object.spec.initContainers)
            ? [
                JSONPatch{op: "add", path: "/spec/initContainers/-", value: Object.spec.initContainers{name: "sandbox-iptables", image: "localhost:5000/sandbox/transparent-iptables-init:0.1.0", securityContext: Object.spec.initContainers.securityContext{runAsUser: 0, allowPrivilegeEscalation: false, capabilities: Object.spec.initContainers.securityContext.capabilities{add: ["NET_ADMIN"]}}}},
                JSONPatch{op: "add", path: "/spec/initContainers/-", value: Object.spec.initContainers{name: "sandbox-install-ca", image: "localhost:5000/sandbox/transparent-mitmproxy:0.1.0", command: ["sh", "-c", "cp /ca/mitmproxy-ca.pem /runtime/mitmproxy-ca.pem && chmod 0400 /runtime/mitmproxy-ca.pem"], securityContext: Object.spec.initContainers.securityContext{runAsUser: 0, allowPrivilegeEscalation: false}, volumeMounts: [Object.spec.initContainers.volumeMounts{name: "sandbox-mitmproxy-ca", mountPath: "/ca", readOnly: true}, Object.spec.initContainers.volumeMounts{name: "sandbox-mitmproxy-runtime", mountPath: "/runtime"}]}}
              ]
            : [
                JSONPatch{op: "add", path: "/spec/initContainers", value: [Object.spec.initContainers{name: "sandbox-iptables", image: "localhost:5000/sandbox/transparent-iptables-init:0.1.0", securityContext: Object.spec.initContainers.securityContext{runAsUser: 0, allowPrivilegeEscalation: false, capabilities: Object.spec.initContainers.securityContext.capabilities{add: ["NET_ADMIN"]}}}, Object.spec.initContainers{name: "sandbox-install-ca", image: "localhost:5000/sandbox/transparent-mitmproxy:0.1.0", command: ["sh", "-c", "cp /ca/mitmproxy-ca.pem /runtime/mitmproxy-ca.pem && chmod 0400 /runtime/mitmproxy-ca.pem"], securityContext: Object.spec.initContainers.securityContext{runAsUser: 0, allowPrivilegeEscalation: false}, volumeMounts: [Object.spec.initContainers.volumeMounts{name: "sandbox-mitmproxy-ca", mountPath: "/ca", readOnly: true}, Object.spec.initContainers.volumeMounts{name: "sandbox-mitmproxy-runtime", mountPath: "/runtime"}]}]}
              ])
          +
          [
            JSONPatch{op: "add", path: "/spec/containers/-", value: Object.spec.containers{name: "sandbox-mitmproxy", image: "localhost:5000/sandbox/transparent-mitmproxy:0.1.0", volumeMounts: [Object.spec.containers.volumeMounts{name: "sandbox-mitmproxy-runtime", mountPath: "/var/run/sandbox-mitmproxy"}]}}
          ]
