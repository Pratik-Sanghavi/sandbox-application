apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: sandbox-transparent-capture.pratiks.io
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.spec.volumes)
            ? [JSONPatch{op: "add", path: "/spec/volumes/-", value: '{"name":"sandbox-mitmproxy-runtime","emptyDir":{}}'}, JSONPatch{op: "add", path: "/spec/volumes/-", value: '{"name":"sandbox-mitmproxy-ca","secret":{"secretName":"sandbox-mitmproxy-ca"}}'}]
            : [JSONPatch{op: "add", path: "/spec/volumes", value: '[{"name":"sandbox-mitmproxy-runtime","emptyDir":{}},{"name":"sandbox-mitmproxy-ca","secret":{"secretName":"sandbox-mitmproxy-ca"}}]'}])
          +
          (has(object.spec.initContainers)
            ? [JSONPatch{op: "add", path: "/spec/initContainers/-", value: '{"name":"sandbox-iptables","image":"localhost:5000/sandbox/transparent-iptables-init:0.1.0","securityContext":{"runAsUser":0,"allowPrivilegeEscalation":false,"capabilities":{"add":["NET_ADMIN"]}}}'}, JSONPatch{op: "add", path: "/spec/initContainers/-", value: '{"name":"sandbox-install-ca","image":"localhost:5000/sandbox/transparent-mitmproxy:0.1.0","command":["sh","-c","cp /ca/mitmproxy-ca.pem /runtime/mitmproxy-ca.pem && chmod 0400 /runtime/mitmproxy-ca.pem"],"securityContext":{"runAsUser":0,"allowPrivilegeEscalation":false},"volumeMounts":[{"name":"sandbox-mitmproxy-ca","mountPath":"/ca","readOnly":true},{"name":"sandbox-mitmproxy-runtime","mountPath":"/runtime"}]}' }]
            : [JSONPatch{op: "add", path: "/spec/initContainers", value: '[{"name":"sandbox-iptables","image":"localhost:5000/sandbox/transparent-iptables-init:0.1.0","securityContext":{"runAsUser":0,"allowPrivilegeEscalation":false,"capabilities":{"add":["NET_ADMIN"]}}},{"name":"sandbox-install-ca","image":"localhost:5000/sandbox/transparent-mitmproxy:0.1.0","command":["sh","-c","cp /ca/mitmproxy-ca.pem /runtime/mitmproxy-ca.pem && chmod 0400 /runtime/mitmproxy-ca.pem"],"securityContext":{"runAsUser":0,"allowPrivilegeEscalation":false},"volumeMounts":[{"name":"sandbox-mitmproxy-ca","mountPath":"/ca","readOnly":true},{"name":"sandbox-mitmproxy-runtime","mountPath":"/runtime"}]}]'}])
          +
          [JSONPatch{op: "add", path: "/spec/containers/-", value: '{"name":"sandbox-mitmproxy","image":"localhost:5000/sandbox/transparent-mitmproxy:0.1.0","volumeMounts":[{"name":"sandbox-mitmproxy-runtime","mountPath":"/var/run/sandbox-mitmproxy"}]}' }]
