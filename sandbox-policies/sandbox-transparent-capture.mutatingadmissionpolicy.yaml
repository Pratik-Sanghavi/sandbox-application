apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: sandbox-transparent-capture.pratiks.io
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{initContainers: [Object.spec.initContainers{name: "sandbox-iptables", image: "localhost:5000/sandbox/transparent-iptables-init:0.1.0", command: ["sh", "-c", "iptables -t nat -A OUTPUT -p tcp --dport 443 -m owner ! --uid-owner 1000 -j REDIRECT --to-ports 8080"], securityContext: Object.spec.initContainers.securityContext{runAsUser: 0, capabilities: Object.spec.initContainers.securityContext.capabilities{add: ["NET_ADMIN"]}}}, Object.spec.initContainers{name: "sandbox-install-ca", image: "localhost:5000/sandbox/transparent-mitmproxy:0.1.0", command: ["sh", "-c", "cp /ca/mitmproxy-ca.pem /var/run/sandbox-mitmproxy/mitmproxy-ca.pem && chmod 0400 /var/run/sandbox-mitmproxy/mitmproxy-ca.pem"], volumeMounts: [Object.spec.initContainers.volumeMounts{name: "sandbox-mitmproxy-ca", mountPath: "/ca", readOnly: true}, Object.spec.initContainers.volumeMounts{name: "sandbox-mitmproxy-runtime", mountPath: "/var/run/sandbox-mitmproxy"}]}], containers: object.spec.containers.map(c, Object.spec.containers{name: c.name}) + [Object.spec.containers{name: "sandbox-mitmproxy", image: "localhost:5000/sandbox/transparent-mitmproxy:0.1.0", command: ["mitmdump"], args: ["--mode", "transparent", "--listen-host", "127.0.0.1", "--listen-port", "8080", "--set", "confdir=/var/run/sandbox-mitmproxy", "-s", "/addons/sandbox_routing.py"], volumeMounts: [Object.spec.containers.volumeMounts{name: "sandbox-mitmproxy-runtime", mountPath: "/var/run/sandbox-mitmproxy"}]}], volumes: [Object.spec.volumes{name: "sandbox-mitmproxy-runtime", emptyDir: Object.spec.volumes.emptyDir{}}, Object.spec.volumes{name: "sandbox-mitmproxy-ca", secret: Object.spec.volumes.secret{secretName: "sandbox-mitmproxy-ca"}}]}}