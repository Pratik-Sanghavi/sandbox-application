apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-hubspot-worker
  labels:
    app.kubernetes.io/name: temporal-hubspot-worker
    app.kubernetes.io/part-of: outbound-api-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-hubspot-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-hubspot-worker
        app.kubernetes.io/part-of: outbound-api-sandbox
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal-hubspot-worker
          image: localhost:5000/sandbox/temporal-hubspot-worker:0.1.1
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_TASK_QUEUE
              value: sandbox-hubspot-api-test
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}