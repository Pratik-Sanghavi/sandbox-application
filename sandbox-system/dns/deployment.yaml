apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-dns
  namespace: sandbox-system-ns-1
  labels:
    app.kubernetes.io/name: sandbox-dns
    app.kubernetes.io/part-of: outbound-api-sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-dns
        app.kubernetes.io/part-of: outbound-api-sandbox
    spec:
      automountServiceAccountToken: false
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.14.2
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: ready
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 70Mi
            limits:
              memory: 170Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: sandbox-dns-corefile
            items:
              - key: Corefile
                path: Corefile
