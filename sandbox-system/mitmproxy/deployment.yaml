apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-mitmproxy
  namespace: sandbox-system-ns-1
  labels:
    app.kubernetes.io/name: sandbox-mitmproxy
    app.kubernetes.io/part-of: outbound-api-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-mitmproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-mitmproxy
        app.kubernetes.io/part-of: outbound-api-sandbox
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: install-ca
          image: localhost:5000/sandbox/mitmproxy:0.1.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              set -eu
              cp /ca-source/mitmproxy-ca.pem /home/mitmproxy/.mitmproxy/mitmproxy-ca.pem
              chown 1000:1000 /home/mitmproxy/.mitmproxy/mitmproxy-ca.pem
              chmod 0400 /home/mitmproxy/.mitmproxy/mitmproxy-ca.pem
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: ca-source
              mountPath: /ca-source
              readOnly: true
            - name: mitmproxy-config
              mountPath: /home/mitmproxy/.mitmproxy
      containers:
        - name: mitmproxy
          image: localhost:5000/sandbox/mitmproxy:0.1.0
          imagePullPolicy: IfNotPresent
          command: [mitmdump]
          args:
            - --mode
            - regular
            - --listen-host
            - 0.0.0.0
            - --listen-port
            - "8080"
            - --set
            - confdir=/home/mitmproxy/.mitmproxy
            - --set
            - block_global=false
          env:
            - name: HOME
              value: /home/mitmproxy
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mitmproxy-config
              mountPath: /home/mitmproxy/.mitmproxy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ca-source
          secret:
            secretName: sandbox-mitmproxy-ca
            items:
              - key: mitmproxy-ca.pem
                path: mitmproxy-ca.pem
        - name: mitmproxy-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
