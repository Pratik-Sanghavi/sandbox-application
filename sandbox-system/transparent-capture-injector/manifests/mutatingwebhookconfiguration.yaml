apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: transparent-capture-injector.pratiks.io
webhooks:
  - name: transparent-capture-injector.pratiks.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    namespaceSelector:
      matchLabels:
        sandbox.pratiks.io/enabled: "true"
    clientConfig:
      service:
        namespace: sandbox-system-ns-1
        name: transparent-capture-injector
        path: /mutate
        port: 443
      caBundle: 
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
