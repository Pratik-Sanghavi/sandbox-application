apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubspot-wiremock
  labels:
    app.kubernetes.io/name: hubspot-wiremock
    app.kubernetes.io/part-of: outbound-api-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hubspot-wiremock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hubspot-wiremock
        app.kubernetes.io/part-of: outbound-api-sandbox
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.13.2
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: http
          livenessProbe:
            httpGet:
              path: /__admin/health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: mappings
              mountPath: /home/wiremock/mappings
              readOnly: true
      volumes:
        - name: mappings
          configMap:
            name: hubspot-wiremock-mappings
